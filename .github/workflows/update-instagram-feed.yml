name: Update Instagram Feed

on:
  schedule:
    # Tuesday and Friday at 05:00 JST (Monday and Thursday at 20:00 UTC).
    - cron: '0 20 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    env:
      APIFY_TASK_ID: DeSWqW5VMzlaIHer8
      APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Apify credentials
        run: |
          if [ -z "$APIFY_API_TOKEN" ]; then
            echo "APIFY_API_TOKEN secret is not configured. Existing feed remains unchanged." >&2
            exit 1
          fi

      - name: Run Apify task and prepare feed
        env:
          APIFY_API_BASE: https://api.apify.com/v2
        run: |
          set -euo pipefail
          auth_header="Authorization: Bearer ${APIFY_API_TOKEN}"
          temp_dir=$(mktemp -d)
          trap 'rm -rf "$temp_dir"' EXIT

          curl -fsSL -X POST -H "$auth_header" \
            "$APIFY_API_BASE/actor-tasks/$APIFY_TASK_ID/runs" \
            -o "$temp_dir/new-run.json"
          run_id=$(jq -er '.data.id' "$temp_dir/new-run.json")

          for attempt in {1..60}; do
            curl -fsSL -H "$auth_header" \
              "$APIFY_API_BASE/actor-runs/$run_id" \
              -o "$temp_dir/run-status.json"
            status=$(jq -er '.data.status' "$temp_dir/run-status.json")
            case "$status" in
              SUCCEEDED) break ;;
              FAILED|ABORTED|TIMED-OUT)
                echo "Apify Task ended with status: $status. Existing feed remains unchanged." >&2
                exit 1
                ;;
            esac
            if [ "$attempt" -eq 60 ]; then
              echo "Apify Task did not finish within 10 minutes. Existing feed remains unchanged." >&2
              exit 1
            fi
            sleep 10
          done

          dataset_id=$(jq -er '.data.defaultDatasetId' "$temp_dir/run-status.json")
          curl -fsSL -H "$auth_header" \
            "$APIFY_API_BASE/datasets/$dataset_id/items?clean=true&limit=20" \
            -o "$temp_dir/items.json"

          jq '[.[] | select(
                (.url | type == "string" and test("^https://(www\\.)?instagram\\.com/(p|reel|tv)/[A-Za-z0-9_-]+/?$")) and
                (.displayUrl | type == "string" and test("^https://")) and
                (.timestamp | type == "string" and length > 0)
              )]
              | sort_by(.timestamp)
              | reverse
              | reduce .[] as $post ([];
                  if any(.[]; .url == $post.url) then . else . + [$post] end
                )
              | .[:4]' "$temp_dir/items.json" > "$temp_dir/latest-items.json"

          jq -e 'length == 4' "$temp_dir/latest-items.json" > /dev/null || {
              echo "Apify did not return four valid, dated Instagram posts. Existing feed remains unchanged." >&2
              exit 1
            }

          jq '[.[] | .url as $url | ($url | capture("/(?:p|reel|tv)/(?<code>[A-Za-z0-9_-]+)").code) as $code |
            {url: $url, image: ("img/instagram/" + $code + ".jpg")} ]' \
            "$temp_dir/latest-items.json" > "$temp_dir/instagram.json"

          if cmp -s "$temp_dir/instagram.json" data/instagram.json; then
            all_images_valid=true
            while IFS= read -r image_path; do
              if [ ! -s "$image_path" ] || ! file --brief --mime-type "$image_path" | grep -q '^image/'; then
                all_images_valid=false
                break
              fi
            done < <(jq -r '.[].image' "$temp_dir/instagram.json")
            if [ "$all_images_valid" = true ]; then
              echo "No Instagram feed changes."
              exit 0
            fi
          fi

          mkdir -p "$temp_dir/images" img/instagram
          while IFS=$'\t' read -r image_url filename; do
            curl -fsSL --retry 3 --retry-all-errors "$image_url" \
              -o "$temp_dir/images/$filename"
            test -s "$temp_dir/images/$filename"
            file --brief --mime-type "$temp_dir/images/$filename" | grep -q '^image/'
          done < <(jq -r '.[] | [.displayUrl, (.url | capture("/(?:p|reel|tv)/(?<code>[A-Za-z0-9_-]+)").code + ".jpg")] | @tsv' \
            "$temp_dir/latest-items.json")

          cp "$temp_dir"/images/* img/instagram/
          mv "$temp_dir/instagram.json" data/instagram.json

      - name: Commit updated feed
        run: |
          if git diff --quiet -- data/instagram.json img/instagram; then
            echo "No Instagram feed changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/instagram.json img/instagram
          git commit -m "Update Instagram feed"
          git push
